<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#092747">
  <meta name="description" content="Mahalle Platformu: Türkiye'deki mahallelerin etkinlikleri, duyuruları, ilanları ve dayanışma ağı.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mahalle">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Mahalle Platformu</title>
</head>
<body>
  <div id="app"><div class="boot"><div class="boot-logo">⌂</div><strong>Mahalle Platformu</strong><span>Mahallenizle bağlantıda kalın.</span></div></div>
  <noscript>Mahalle Platformu için JavaScript etkin olmalıdır.</noscript>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <!-- Yeni sürüm: Supabase ayarlarını önbellekten bağımsız yükle -->
  <script src="./config.js?v=20261108-range-v1"></script>
  <script>
    // Supabase JS kendisi /rest/v1 ekler. Kullanıcı bu eki yanlışlıkla
    // config.js'ye yapıştırdıysa adresi proje köküne normalleştir.
    (function () {
      var c = window.MAHALLE_CONFIG;
      if (!c || !c.SUPABASE_URL) return;
      try {
        var url = new URL(String(c.SUPABASE_URL).trim());
        if (!/^https?:$/.test(url.protocol)) throw new Error('Geçersiz protokol');
        c.SUPABASE_URL = url.origin;
      } catch (err) {
        console.error('Supabase Project URL geçersiz. Ayarları kontrol edin.');
        c.SUPABASE_URL = '';
      }
    }());
  </script>
  <script src="./app.js?v=20261108-range-v1" defer></script>
</body>
</html>
